dataset:
    path: data/raw/crop_recommendation.csv
    schema: config/schema.yaml
    target: label
split:
    test_size: 0.2
    random_seed: 42
mlflow:
    tracking_uri: http://127.0.0.1:5001
    experiment_name: crop-recommendation
    registered_model_name: crop-recommendation
    champion_alias: champion
monitoring:
    requests_log: logs/requests.jsonl
    drift_report: reports/drift_report.html
    min_requests: 50 # en dessous, pas de conclusion
    drift_method: ks # test de Kolmogorov-Smirnov, variable par variable
    drift_threshold: 0.05 # dérive si la p-value est inférieure
    drift_share: 0.1 # part de variables en dérive qui déclenche l'alerte : 1 sur 7 suffit
model:
    params:
        n_estimators: 200
        max_depth: null
tuning:
    cv_folds: 5
    scoring: f1_macro
    param_grid:
        n_estimators: [50, 100, 200]
        max_depth: [3, 5, 10, null]
