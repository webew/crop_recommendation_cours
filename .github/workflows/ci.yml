name: CI

on:
    push:
    pull_request:

permissions:
    contents: read

jobs:
    tests:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: astral-sh/setup-uv@v10.3.3 # pas de tag majeur (v10) publié depuis v8
            - run: uv sync --locked
            - run: uv run ruff check .
            - run: uv run ruff format --check .
            - run: uv run pytest

    # Publie l'image de l'API sur GitHub Container Registry (ghcr.io),
    # seulement si les tests passent, et seulement pour main et les tags d'étape :
    # jamais pour une pull request (celles de Dependabot comprises).
    image:
        needs: tests
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/etape-'))
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write # droit d'écrire dans ghcr.io, limité à ce job
        steps:
            - uses: actions/checkout@v7
            - uses: docker/setup-buildx-action@v4
            - uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }} # jeton temporaire fourni par GitHub, aucun secret à créer
            - id: meta
              uses: docker/metadata-action@v6
              with:
                  images: ghcr.io/${{ github.repository }}
                  # main -> latest ; tag etape-13 -> etape-13 ; toujours sha-<commit> pour la traçabilité
                  tags: |
                      type=raw,value=latest,enable={{is_default_branch}}
                      type=ref,event=tag
                      type=sha
            - uses: docker/build-push-action@v7
              with:
                  context: .
                  file: Dockerfile.api
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=min
